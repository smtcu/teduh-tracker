name: TEDUH launch watch

# Split out of the daily refresh on 22 Sep 2026. The watch spends ~20 minutes
# probing speculative codes, and when TEDUH had its afternoon outage it was
# one more thing keeping a doomed run alive. Separately, a slow watch can
# never again delay the day's sales figures.
#
# No `schedule:` here, on purpose. This started on GitHub's own cron at
# 01:53 UTC and it ran 5-6 hours late every day; on 28 Sep 2026 it landed at
# 07:49 UTC, inside the 4pm refresh, and its push conflicted with the
# refresh's and cost that day's afternoon figures. It now runs on
# `workflow_run`: GitHub starts it when the refresh finishes, within a
# minute, so it can never overlap one -- the next refresh is hours away.
on:
  workflow_run:
    workflows: ["TEDUH tracker refresh"]
    types: [completed]
  workflow_dispatch:      # you, from the Actions tab

permissions:
  contents: write

# Same group as the refresh so the two never run at once: both commit
# projects.csv and data/, and binary docs cannot merge. If a refresh is
# already running, this waits its turn.
concurrency:
  group: teduh-refresh
  cancel-in-progress: false

jobs:
  watch:
    # Once a day is enough, so only the morning refresh (dispatched 23:17
    # UTC, 07:17 MYT) is followed. Any projects.csv-push rebuild, or a manual
    # refresh at another hour, is ignored. A manual run always goes ahead.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.workflow_run.created_at, 'T23:')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # watch_developers.py and build_dashboard.py are stdlib-only,
      # so there is nothing to pip install.

      - name: Watch for new developer launches
        timeout-minutes: 40      # ~20 minutes on a healthy day
        run: python scripts/watch_developers.py

      # Only a find is worth a commit. Rebuilding the site on a quiet day
      # changes nothing but the "generated" timestamp, and that sits on the
      # same single JSON line the refresh rewrites -- a timestamp-only
      # commit is exactly what conflicted with the 28 Sep 2026 refresh.
      - name: Did the watch find anything?
        id: found
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- data/teduh_watch.csv projects.csv; then
            echo "Nothing new. Skipping the site rebuild and the commit."
            echo "any=no" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff --stat -- data/teduh_watch.csv projects.csv
            echo "any=yes" >> "$GITHUB_OUTPUT"
          fi

      # Rebuild the website so a find's +N badge appears now, not at the
      # next refresh. docs/downloads is untouched, so the Download section
      # keeps listing exactly the files the last refresh produced.
      - name: Build website
        if: ${{ !cancelled() && steps.found.outputs.any == 'yes' }}
        run: python scripts/build_dashboard.py

      - name: Commit
        if: ${{ !cancelled() && steps.found.outputs.any == 'yes' }}
        run: |
          git config user.name  "teduh-bot"
          git config user.email "teduh-bot@users.noreply.github.com"
          # projects.csv joins the commit because a licensed find is appended
          # to its developer tracker automatically.
          git add data/teduh_watch.csv projects.csv docs
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Launch watch $(date -u +%Y-%m-%d)"
          # The refresh may have pushed while this was running. A conflicted
          # rebase is aborted before the retry so the checkout never sits in
          # a detached HEAD, and a real conflict fails the run visibly.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying"
            sleep 10
          done
          exit 1
