name: TEDUH tracker refresh

on:
  schedule:
    # 02:00 UTC daily = 10:00 AM Malaysia / Singapore time.
    # The website updates every day; the Excel trackers gain a column on Fridays only.
    - cron: "0 2 * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: teduh-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet openpyxl

      - name: Scrape TEDUH
        id: scrape
        run: python scripts/scrape_teduh.py

      - name: Build website
        if: always()
        run: python scripts/build_dashboard.py

- name: Build weekly Excel trackers (Fridays only)
        if: always() && steps.when.outputs.weekly == 'yes'
        run: |
          python scripts/build_trackers.py projects.csv data/teduh_history.csv docs/downloads
          python - <<'PY'
          import glob, os, shutil
          d = "docs/downloads"
          # Filenames contain spaces, so this is done in Python rather than shell
          # globbing, and the fixed-name copy is excluded from the candidates so it
          # can never be copied onto itself.
          for pattern, stable in [("*Seputeh*.xlsx", "Seputeh_Hills_Teduh_Weekly_Update.xlsx"),
                                  ("*Developer*.xlsx", "Tduh_Developer_Project_Sales_Status.xlsx")]:
              dated = [f for f in glob.glob(os.path.join(d, pattern))
                       if os.path.basename(f) != stable]
              dated.sort(key=os.path.getmtime, reverse=True)
              if dated:
                  shutil.copyfile(dated[0], os.path.join(d, stable))
                  print("latest ->", stable, "from", os.path.basename(dated[0]))
              for old in dated[4:]:          # keep the four most recent dated copies
                  os.remove(old)
                  print("removed", os.path.basename(old))
          PY

      - name: Publish data for download
        if: always()
        run: cp data/teduh_daily.csv data/teduh_history.csv data/teduh_by_type.csv docs/data/ || true

      - name: Commit
        if: always()
        run: |
          git config user.name  "teduh-bot"
          git config user.email "teduh-bot@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "TEDUH refresh $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push
