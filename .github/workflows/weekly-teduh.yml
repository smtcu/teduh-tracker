name: TEDUH tracker refresh

on:
  # No `schedule:` trigger here on purpose. GitHub queues its own cron behind
  # everything else and can fire an hour or more late, which is why a Cloudflare
  # Worker calls workflow_dispatch instead -- see cloudflare-worker/ for the two
  # daily triggers (07:17 and 16:00 Malaysia time).
  #
  # Keeping both was actively harmful, not just redundant: on 12 Aug 2026 the
  # GitHub cron and a dispatched run overlapped, and because a Friday rebuild
  # rewrites the same .xlsx and .pdf files, the second run hit a binary merge
  # conflict git could not resolve and died mid-rebase with a detached HEAD.
  #
  # The website and the daily workbook refresh every day.
  # The Excel trackers and the PDF report are rebuilt on Fridays only.
  workflow_dispatch:        # the Cloudflare Worker, or you from the Actions tab

permissions:
  contents: write

concurrency:
  group: teduh-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Empty unless you add these under Settings -> Secrets and variables -> Actions.
      # With them unset, the email step is skipped and everything else runs as normal.
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet openpyxl reportlab

      - name: Work out whether today is Friday in Malaysia
        id: when
        run: |
          DOW=$(TZ=Asia/Kuala_Lumpur date +%u)
          if [ "$DOW" = "5" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "weekly=yes" >> "$GITHUB_OUTPUT"
          else
            echo "weekly=no" >> "$GITHUB_OUTPUT"
          fi
          echo "Day of week (MYT): $DOW"

      # Runs before the scrape on purpose. A broken script used to surface only
      # once the scraper reached its first project, several minutes and one
      # wasted TEDUH round-trip later. This fails in seconds instead, and does
      # it before anything has written to data/ or docs/.
      - name: Pre-flight self-test
        run: python scripts/selftest.py

      - name: Scrape TEDUH
        run: python scripts/scrape_teduh.py

      # The website build has moved BELOW the workbook and PDF steps. Its
      # Download section is now generated by listing docs/downloads, so building
      # it first meant the page described the previous run's files -- and a file
      # built for the first time would not be linked until the day after.
      - name: Build daily workbook and daily PDF
        if: always()
        run: |
          mkdir -p docs/downloads docs/data
          python scripts/build_daily_xlsx.py projects.csv data/teduh_daily.csv docs/downloads/Teduh_Daily_Tracker.xlsx
          python scripts/build_pdf.py projects.csv data/teduh_daily.csv docs/downloads/TEDUH_Daily_Report.pdf --daily

      - name: Build weekly Excel trackers (Fridays only)
        if: always() && steps.when.outputs.weekly == 'yes'
        run: |
          python scripts/build_trackers.py projects.csv data/teduh_history.csv docs/downloads \
            --seed-from=data/teduh_daily.csv
          python - <<'PY'
          import glob, os, shutil
          d = "docs/downloads"
          # Done in Python, not shell globbing: the filenames contain spaces, and the
          # fixed-name copy is excluded so it can never be copied onto itself.
          # Johor was missing from this list, so the dated Johor workbook was
          # built every Friday but Johor_Teduh_Weekly_Update.xlsx -- the name the
          # website links to -- was never created from it.
          pairs = [("*Seputeh*.xlsx", "Seputeh_Hills_Teduh_Weekly_Update.xlsx"),
                   ("*Developer*.xlsx", "Tduh_Developer_Project_Sales_Status.xlsx"),
                   ("*Johor*.xlsx", "Johor_Teduh_Weekly_Update.xlsx"),
                   ("*Ukay*.xlsx", "Ukay_Teduh_Weekly_Update.xlsx")]
          for pattern, stable in pairs:
              dated = [f for f in glob.glob(os.path.join(d, pattern))
                       if os.path.basename(f) != stable]
              dated.sort(key=os.path.getmtime, reverse=True)
              if not dated:
                  continue
              shutil.copyfile(dated[0], os.path.join(d, stable))
              print("latest ->", stable, "from", os.path.basename(dated[0]))
              for old in dated[4:]:
                  os.remove(old)
                  print("removed", os.path.basename(old))
          PY

      # Two PDFs, not one. --only=areas keeps the forwarded weekly report the
      # length it has always been; the thirteen competitor trackers go into
      # their own file, which nobody has to open unless they want it.
      - name: Build the weekly PDF reports (Fridays only)
        if: always() && steps.when.outputs.weekly == 'yes'
        run: |
          python scripts/build_pdf.py projects.csv data/teduh_history.csv \
            docs/downloads/TEDUH_Weekly_Report.pdf --only=areas
          python scripts/build_pdf.py projects.csv data/teduh_history.csv \
            docs/downloads/TEDUH_Competitor_Report.pdf --only=developers

      # Last, so the Download section lists what this run actually produced.
      - name: Build website
        if: always()
        run: python scripts/build_dashboard.py

      - name: Note when the weekly files were skipped
        if: always() && steps.when.outputs.weekly != 'yes'
        run: echo "Not Friday — the weekly Excel trackers were left exactly as they were."

      - name: Compose the week's summary
        if: always() && steps.when.outputs.weekly == 'yes' && env.MAIL_USERNAME != ''
        run: |
          {
            echo 'SUMMARY<<TEDUH_EOF'
            python scripts/weekly_summary.py
            echo TEDUH_EOF
          } >> "$GITHUB_ENV"

      - name: Email the weekly trackers
        if: always() && steps.when.outputs.weekly == 'yes' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: TEDUH Tracker <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: TEDUH weekly update
          body: ${{ env.SUMMARY }}
          attachments: docs/downloads/TEDUH_Weekly_Report.pdf,docs/downloads/TEDUH_Competitor_Report.pdf,docs/downloads/TEDUH_Daily_Report.pdf,docs/downloads/Seputeh_Hills_Teduh_Weekly_Update.xlsx,docs/downloads/Tduh_Developer_Project_Sales_Status.xlsx,docs/downloads/Ukay_Teduh_Weekly_Update.xlsx,docs/downloads/TEDUH_Competitor_Trackers.xlsx,docs/downloads/Teduh_Daily_Tracker.xlsx

      - name: WhatsApp alert
        if: always() && steps.when.outputs.weekly == 'yes' && env.WHATSAPP_PHONE != ''
        continue-on-error: true          # a failed nudge must never fail the run
        run: |
          MSG=$(python scripts/weekly_summary.py --short)
          curl -sS --get --max-time 30 \
            --data-urlencode "phone=$WHATSAPP_PHONE" \
            --data-urlencode "text=$MSG" \
            --data-urlencode "apikey=$WHATSAPP_APIKEY" \
            https://api.callmebot.com/whatsapp.php \
          && echo "WhatsApp alert sent." || echo "WhatsApp alert failed — ignoring."

      - name: Note when no email was configured
        if: always() && env.MAIL_USERNAME == ''
        run: echo "No mail secrets set — skipping the email step."

      - name: Publish data for download
        if: always()
        run: cp data/teduh_daily.csv data/teduh_history.csv data/teduh_by_type.csv docs/data/ || true

      - name: Commit
        if: always()
        run: |
          git config user.name  "teduh-bot"
          git config user.email "teduh-bot@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "TEDUH refresh $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push
