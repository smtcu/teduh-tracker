name: TEDUH developer discovery

# Manual only. This is a one-off index build, not part of the daily refresh, and
# it never touches the trackers, the dashboard or any tracker data file.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First developer code to probe (30000 covers the newest developers)"
        default: "30000"
      end:
        description: "Last developer code to probe"
        default: "33000"
      rps:
        description: "Starting requests per second — it slows itself further if TEDUH refuses"
        default: "1.5"
      minutes:
        description: "Stop cleanly after this many minutes"
        default: "300"
      skip_projects:
        description: "Index developers only, skipping their project lists"
        type: boolean
        default: false

permissions:
  contents: write

# Deliberately not the daily job's group: a three-hour scan must not hold up
# the morning refresh. The push step rebases instead.
concurrency:
  group: teduh-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet openpyxl

      - name: Scan developer codes
        run: |
          python scripts/discover_developers.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --rps "${{ inputs.rps }}" \
            --minutes "${{ inputs.minutes }}" \
            ${{ inputs.skip_projects && '--skip-projects' || '' }}

      # Everything this job writes stays under data/. Nothing in docs/ changes,
      # so the published website is byte-for-byte what it was before the run.
      - name: Build the cross-check workbook
        if: always()
        run: python scripts/build_developer_workbook.py data/TEDUH_Company_Index.xlsx

      - name: Confirm the website was untouched
        if: always()
        run: |
          if git status --porcelain -- docs | grep .; then
            echo "::error::this job changed something under docs/ — it must not"
            exit 1
          fi
          echo "docs/ is unchanged, as intended."

      - name: Commit the index
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/developers.csv data/projects_index.csv data/TEDUH_Company_Index.xlsx
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Developer index: codes ${{ inputs.start }}-${{ inputs.end }}"
          # The daily refresh may have pushed while this was running.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 10
          done
          exit 1
