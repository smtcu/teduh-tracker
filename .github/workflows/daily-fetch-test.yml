name: Daily-watch fetch (test run)

# A one-off test of scripts/probe_daily_fetch.py: can the daily pre-launch
# watch's own download code read Maxim Global (and re-check a few others)?
# Report only -- the answer is the run's Summary page. Writes nothing.

on:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/probe_daily_fetch.py'
      - '.github/workflows/daily-fetch-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Try the sites (report only)
        run: python scripts/probe_daily_fetch.py
