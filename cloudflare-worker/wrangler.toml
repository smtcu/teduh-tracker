name = "teduh-workflow-trigger"
main = "src/index.js"
compatibility_date = "2024-11-01"

# This is the schedule the Worker itself runs on (Cloudflare's cron, not GitHub's).
# 23:17 UTC = 07:17 AM Malaysia / Singapore time the following day, same time the
# GitHub workflow was already aiming for.
# 08:00 UTC = 4:00 PM Malaysia / Singapore time, same day -- a second daily refresh.
# 03:00 UTC = 11:00 AM Malaysia time -- the launch watch (watch-launches.yml),
#             not a refresh. It lived on GitHub's own cron until 28 Sep 2026,
#             when a six-hour-late run collided with the 4pm refresh. Placed
#             hours clear of both refreshes so it can never queue against one.
[triggers]
crons = ["17 23 * * *", "0 8 * * *", "0 3 * * *"]

[vars]
GH_OWNER = "smtcu"
GH_REPO = "teduh-tracker"
GH_WORKFLOW_FILE = "weekly-teduh.yml"
# Which cron above fires the launch watch instead of the refresh, and what
# it dispatches. The string must match the crons entry exactly.
GH_WATCH_CRON = "0 3 * * *"
GH_WATCH_WORKFLOW_FILE = "watch-launches.yml"
GH_REF = "main"
# Secrets are NOT set here on purpose -- they're added separately with
# `npx wrangler secret put <NAME>` so they never get written to a file or git.
#   GITHUB_TOKEN    needs Contents: read/write AND Pull requests: read/write on
#                   the repo (the old dispatch-only token may lack those scopes).
#   ALLOWED_ORIGIN  the dashboard's own origin, which stays out of this repo.
#                   The form has no passphrase, so this origin check plus
#                   PR-merge approval are the only gates. Unset falls back to
#                   "*" (any site may call the endpoints).
